

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número | Tech Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!--     <script src="script2.js"></script>
        <script src="descuentos2.js"></script> -->
</head>
<body>
  <div class="game-card" id="game-card">
    <h1>🎯 Adivina el Número</h1>
    <p class="subtitle">Estoy pensando en un número del 1 al 100...</p>

    <div class="controls">
      <input type="number" id="inputIntento" min="1" max="100" placeholder="?" autocomplete="off" aria-label="Tu intento">
      <button id="btnAdivinar">Adivinar</button>
    </div>

    <p id="mensaje"></p>
    <p id="contador">Intentos: 0</p>
    <p id="historial">Historial: </p>

    <button id="btnReiniciar" style="display: none;">
      🔄 Jugar de nuevo
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
